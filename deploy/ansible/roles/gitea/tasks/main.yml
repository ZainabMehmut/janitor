---
# Optional role (see site.yml, gated by enable_gitea) - stands up a real
# Gitea instance the same way it was originally hand-configured for the
# forge-plugin E2E proof: a real account + access token, wired into
# breezy's authentication.conf by roles/janitor_config. Not meant as a
# production forge, just enough to prove janitor's Gitea plugin against a
# real server instead of manual API calls.

- name: Create Gitea data directories
  file:
    path: "{{ gitea_home }}/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    # group explicitly, not just owner: ansible.builtin.file leaves new
    # paths group-owned by root otherwise (confirmed live via stat/namei),
    # and podman unshare's own gid map only covers the deploy user's real
    # gid and the subgid range - group root falls in neither, so the
    # kernel can't resolve it inside that namespace and the later chown
    # task below fails outright (fchownat EPERM) even though the owner
    # (uid) side of the exact same operation succeeds fine.
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - data
    - data/gitea
    - data/gitea/conf

- name: Deploy app.ini
  # Deployed under the data volume, at the image's own real default config
  # path (WorkPath=/data/gitea) - the image ignores GITEA_APP_INI for both
  # `gitea web` and `gitea admin`, only `--config` (checked manually) or
  # this default path actually gets read, so put it where it already looks
  # instead of fighting that.
  template:
    src: app.ini.j2
    dest: "{{ gitea_home }}/data/gitea/conf/app.ini"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Give the container's own UID real ownership of the whole data tree
  # The actual root cause behind every one of gitea's own first-run mkdir/
  # chown/sqlite-open failures under /data: rootless podman's default UID
  # remap means the gitea process (container UID 1000, matching
  # USER_UID/USER_GID in gitea.container.j2) is NOT the same host
  # identity as {{ ansible_user }}, who owns this bind-mounted
  # directory - every attempt gitea makes to create something new under
  # /data it doesn't already own (a subdirectory, its own conf file
  # rewrite, even its sqlite db's journal file) fails permission-denied,
  # and the process dies fatally the moment it hits one (confirmed one at
  # a time: home, attachments, avatars, repo-avatars, repo-archive,
  # packages, actions_log, actions_artifacts, queues, and finally the
  # gitea.db file itself). `podman unshare chown` runs inside the same
  # user-namespace mapping podman itself uses for containers, so
  # "chown 1000:1000" here resolves to whatever host UID container UID
  # 1000 actually maps to on this specific host (its real subuid range,
  # not a hardcoded number) - after this, gitea genuinely owns everything
  # under data/ and every one of those failures goes away at the source,
  # not one path at a time.
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[ansible_user][1] }}"
  command: podman unshare chown -R 1000:1000 {{ gitea_home }}/data
  changed_when: true

- name: Create quadlet unit directory
  file:
    path: "/home/{{ ansible_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Deploy the gitea quadlet unit
  template:
    src: gitea.container.j2
    dest: "/home/{{ ansible_user }}/.config/containers/systemd/gitea.container"
    owner: "{{ ansible_user }}"
    mode: "0644"
  notify: reload user systemd for gitea

- meta: flush_handlers

- name: Start gitea
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[ansible_user][1] }}"
  systemd:
    name: gitea.service
    scope: user
    state: started

- name: Wait for gitea to actually be ready
  # gitea's own CLI only works once its DB migration/setup has finished -
  # a plainer "podman exec gitea true" would return before that, same
  # race janitor_quadlet's worker-readiness check guards against.
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[ansible_user][1] }}"
  command: podman exec --user git gitea gitea admin user list
  register: gitea_ready
  until: gitea_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false

- name: Create the bot account
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[ansible_user][1] }}"
  command: >
    podman exec --user git gitea gitea admin user create
    --username {{ gitea_bot_user }}
    --password {{ gitea_bot_password }}
    --email {{ gitea_bot_user }}@{{ gitea_domain }}
    --admin
    --must-change-password=false
  when: "gitea_bot_user not in gitea_ready.stdout"
  no_log: true

- name: Check whether the bot's access token already exists
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[ansible_user][1] }}"
  command: >
    podman exec --user git gitea gitea admin user generate-access-token
    --username {{ gitea_bot_user }}
    --token-name janitor
    --scopes all
  register: gitea_token_create
  changed_when: "'Access token was successfully created' in gitea_token_create.stdout"
  failed_when:
    - gitea_token_create.rc != 0
    - "'already exists' not in gitea_token_create.stderr"
  no_log: true

- name: Set the access token fact
  # generate-access-token errors on a second run ("token name already
  # exists") rather than reprinting the token - Gitea never exposes an
  # existing token's value again after creation, only its name/scopes, so
  # this role's own idempotency can't recover a token from a re-run. The
  # ansible_facts.set fact below only reflects the LATEST run's real
  # value; see docs/multi-host-deployment.md for the recovery path (drop
  # the token from gitea's admin UI, delete gitea_home/data so INSTALL_LOCK
  # is cleared too if genuinely starting over).
  set_fact:
    gitea_access_token: "{{ gitea_token_create.stdout_lines[-1] | trim if gitea_token_create.rc == 0 else 'CHANGEME-see-docs-multi-host-deployment' }}"
  no_log: true
